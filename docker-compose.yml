# version: "3.9"

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: local-llm
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=41980
      - LLAMA_ARG_UI_MCP_PROXY=1
      - LLAMA_ARG_UI_CONFIG_FILE=/ui-config.json
      # - LLAMA_ARG_SSE_PING_INTERVAL=10
    network_mode: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./models:/models:ro
      - /home/ubuntu/.cache/huggingface/hub:/hf_models:ro
      # mount UI configuration file
      - ./.config/ui-config.json:/ui-config.json

    # # Qwen3.6-35B-A3B, quantized
    command: >
      -m /models/qwen/Qwen3.6-35B-A3B-Q4_K_M.gguf
      --mmproj /models/qwen/mmproj-Qwen3.6-35B-A3B-BF16.gguf
      --no-mmproj-offload
      --image-min-tokens 1024
      --threads 6
      --load-mode none
      --fit off
      -np 1
      -c 59632
      --reasoning_budget 256
      -b 4096
      -ub 2048
      -ctk q8_0
      -ctv q8_0
      -fa 'on'
      --n-cpu-moe 23
      --timeout 1200
      --reasoning-preserve
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:41980/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  openai-chat-retry-proxy:
    build:
      context: ./services/openai-chat-retry-proxy
    container_name: openai-chat-retry-proxy
    network_mode: host
    environment:
      - UPSTREAM_URL=http://127.0.0.1:41980
      - HOST=127.0.0.1
      - PORT=41981
      - HEADER_GRACE_MS=180000
      - RETRY_DELAY_MS=120000
      - HEARTBEAT_INTERVAL_MS=15000
      - MAX_RETRIES=1
    restart: unless-stopped
  web-search-mcp:
    build:
      context: ./mcp-services/web-search
    container_name: web-search-mcp
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=5005
      - BROWSER_HEADLESS=true
      - MAX_BROWSERS=2
      - DEFAULT_TIMEOUT=6000
    restart: unless-stopped
    network_mode: host

